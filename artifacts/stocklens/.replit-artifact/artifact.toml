kind = "web"
previewPath = "/"
title = "StockLens"
description = "A premium Indian equity research prototype that helps everyday investors understand a company through plain-English business analysis, financial trends, risks, management commentary, valuation context, and sample news."
version = "1.0.0"
id = "artifacts/stocklens"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19744

[services.development]
run = "pnpm --filter @workspace/stocklens run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/stocklens", "run", "build" ]
serve = "static"
publicDir = "artifacts/stocklens/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19744"
BASE_PATH = "/"
