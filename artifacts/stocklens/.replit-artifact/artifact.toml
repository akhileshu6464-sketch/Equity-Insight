kind = "web"
previewPath = "/"
title = "StockLens"
description = "A plain-English Indian stock research website that helps investors understand what happened in a company, why it happened, and what to watch next, starting with a realistic Reliance Industries prototype."
version = "1.0.0"
id = "artifacts/stocklens"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19744

[services.development]
run = "pnpm --filter @workspace/stocklens run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/stocklens", "run", "build" ]
serve = "static"
publicDir = "artifacts/stocklens/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19744"
BASE_PATH = "/"
